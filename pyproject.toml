[project]
name = "auto-healing-agent-runtime"
version = "0.1.0"
description = "Governed event-driven auto-healing suggestion runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "aiokafka>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
